set_ip_parameter:
  name: Set IP parameter
  description: >-
    Changes a network parameter (SICP 7.13). Danger: an incorrect value can
    strand the display off the network until someone resets it locally.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: philips_sicp
    parameter:
      required: true
      selector:
        select:
          options: [ip_address, subnet, gateway, dns1, dns2]
    value:
      example: "192.168.1.50"
      selector:
        text:
    dhcp:
      default: false
      selector:
        boolean:

set_monitor_id:
  name: Set monitor ID
  description: >-
    Changes the addressable Monitor ID of a display (SICP 7.15). Danger: once
    changed, this integration will stop being able to reach it under its old
    ID - update the config entry afterwards.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: philips_sicp
    new_monitor_id:
      required: true
      selector:
        number:
          min: 1
          max: 255

set_failover_priority:
  name: Set failover source priority
  description: Sets the ordered list of failover input sources (SICP 5.5).
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: philips_sicp
    sources:
      required: true
      example: "[13, 0, 5]"

reset_scheduler:
  name: Reset scheduler page
  description: Resets one (or all) power/input scheduler pages to defaults (SICP 10.3).
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: philips_sicp
    page:
      default: 0
      selector:
        number:
          min: 0
          max: 7
